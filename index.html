<div id="root"><div id="boot-fallback">loading pantry…</div></div>

<!-- Surfaces the real error text on screen instead of a silent failure — this must load
     first, before anything else has a chance to throw. -->
<script>
  function showBootError(text) {
    const el = document.getElementById("boot-fallback");
    if (!el) return;
    el.style.whiteSpace = "pre-wrap";
    el.style.textAlign = "left";
    el.style.alignItems = "flex-start";
    el.style.padding = "20px";
    el.style.fontSize = "11px";
    el.style.color = "#B5482F";
    el.textContent = text;
  }
  window.addEventListener("error", (e) => {
    const err = e.error;
    showBootError(
      "Script error: " + (err && err.message ? err.message : e.message || "unknown") +
      (err && err.stack ? "\n\n" + err.stack : "")
    );
  });
  window.addEventListener("unhandledrejection", (e) => {
    const reason = e.reason;
    const msg = reason && reason.message ? reason.message : String(reason);
    const stack = reason && reason.stack ? reason.stack : "";
    showBootError("Unhandled error: " + msg + (stack ? "\n\n" + stack : ""));
  });
</script>

<!-- Storage shim: the app's own code only ever calls window.storage.get/set with one
     key ("pantry-data") — this routes that through to the current household's row in
     Supabase instead of local storage, so app.js itself never has to know the difference. -->
<script>
  window.storage = {
    async get(key) {
      const householdId = window.currentHouseholdId;
      if (!householdId) return null;
      try {
        const { data, error } = await supabaseClient
          .from("household_data")
          .select("data")
          .eq("household_id", householdId)
          .maybeSingle();
        if (error || !data) return null;
        return { key, value: JSON.stringify(data.data) };
      } catch (e) {
        return null;
      }
    },
    async set(key, value) {
      const householdId = window.currentHouseholdId;
      if (!householdId) throw new Error("No household selected");
      const parsed = JSON.parse(value);
      const { error } = await supabaseClient
        .from("household_data")
        .upsert({ household_id: householdId, data: parsed, updated_at: new Date().toISOString() });
      if (error) throw error;
      return { key, value };
    },
    async delete(key) {
      return { key, deleted: true };
    },
    async list(prefix) {
      return { keys: [] };
    },
  };
</script>

<!-- React + Babel, vendored locally (not CDN) so the app fully loads offline -->

  root.render(<ErrorBoundary><AppRoot /></ErrorBoundary>);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {
        // offline caching just won't be available — the app still works online
      });
    });
  }
</script>
